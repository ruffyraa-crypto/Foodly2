                    localStorage.setItem('foodly_dark', 'false');

                                        <option>Vegetarisch</option>
                                        <option>Vegan</option>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {filteredRecipes.map(recipe => (
                                            <div key={recipe.id} onClick={() => setSelectedRecipe(recipe)} className="bg-white dark:bg-cardDark rounded-2xl overflow-hidden shadow-sm border border-gray-100 dark:border-gray-800 cursor-pointer hover:shadow-md transition-all flex flex-col justify-between">
                                                <div className="relative h-40">
                                                    <img src={recipe.image} alt={recipe.name} className="w-full h-full object-cover" />
                                                    <div className="absolute top-3 left-3 bg-white/90 dark:bg-cardDark/90 px-2 py-0.5 rounded-full text-xs font-bold text-primary">
                                                        {recipe.category}
                                                    </div>
                                                </div>
                                                <div className="p-4">
                                                    <h3 className="font-bold text-lg text-gray-900 dark:text-white line-clamp-1">{recipe.name}</h3>
                                                    <p className="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-1">{recipe.description}</p>
                                                    <div className="flex items-center justify-between mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 text-xs font-bold text-gray-600 dark:text-gray-300">
                                                        <span>{recipe.cals} kcal</span>
                                                        <span className="text-primary">{recipe.protein}g Protein</span>
                                                        <span className="text-gray-900 dark:text-white font-extrabold">{recipe.price.toFixed(2)} €</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'discover' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-extrabold text-gray-900 dark:text-white">Entdecken & Supermarkt-Preise</h1>
                                <p className="text-gray-500 text-sm">Deine aktuelle Vorauswahl für Supermarkt: <span className="font-bold text-primary">{profile.supermarket}</span></p>
                                <div className="bg-white dark:bg-cardDark p-6 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm">
                                    <h3 className="font-bold text-lg mb-2 text-gray-900 dark:text-white">🛒 Spar-Tipp</h3>
                                    <p className="text-sm text-gray-600 dark:text-gray-300">Durch den Einkauf bei {profile.supermarket} sparst du bei den Grundzutaten im Schnitt ca. 15-20% gegenüber Markenprodukten.</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'aicoach' && (
                            <div className="flex flex-col h-[75vh] bg-white dark:bg-cardDark rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
                                <div className="p-4 bg-orange-50 dark:bg-orange-900/20 border-b border-gray-100 dark:border-gray-800">
                                    <h2 className="font-bold text-gray-900 dark:text-white">FOODLY KI-Kochassistent</h2>
                                    <p className="text-xs text-green-600 font-medium">● Bereit</p>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto space-y-4">
                                    {chatMessages.map((msg, idx) => (
                                        <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[80%] p-4 rounded-2xl text-sm font-medium ${msg.role === 'user' ? 'bg-primary text-white rounded-br-none' : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-bl-none'}`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4 border-t border-gray-100 dark:border-gray-800 bg-white dark:bg-cardDark flex items-center space-x-2">
                                    <input 
                                        type="text" 
                                        placeholder="Frag die KI nach Rezepten oder Budget..." 
                                        value={chatInput}
                                        onChange={(e) => setChatInput(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                                        className="flex-1 p-3 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 text-sm font-medium text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"
                                    />
                                    <button onClick={handleSendMessage} className="bg-primary text-white p-3 rounded-xl font-bold hover:bg-orange-600 shadow-md">
                                        <i data-lucide="send" className="w-5 h-5"></i>
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'cookbook' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-extrabold text-gray-900 dark:text-white">Mein Kochbuch</h1>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {recipes.filter(r => favorites.includes(r.id)).map(recipe => (
                                        <div key={recipe.id} onClick={() => setSelectedRecipe(recipe)} className="bg-white dark:bg-cardDark rounded-2xl overflow-hidden shadow-sm border border-gray-100 dark:border-gray-800 cursor-pointer flex p-3 items-center space-x-4">
                                            <img src={recipe.image} alt={recipe.name} className="w-20 h-20 rounded-xl object-cover" />
                                            <div className="flex-1">
                                                <span className="text-xs font-bold text-primary">{recipe.category}</span>
                                                <h3 className="font-bold text-gray-900 dark:text-white">{recipe.name}</h3>
                                                <p className="text-xs text-gray-500 mt-1">{recipe.cals} kcal • {recipe.protein}g Protein • {recipe.price.toFixed(2)} €</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'planner' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-extrabold text-gray-900 dark:text-white">Wochenplaner & Einkaufsliste</h1>
                                <div className="bg-white dark:bg-cardDark p-6 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm">
                                    <h3 className="font-extrabold text-lg mb-3 text-gray-900 dark:text-white">🛒 Einkaufsliste ({profile.supermarket})</h3>
                                    <ul className="space-y-2 text-sm font-medium text-gray-700 dark:text-gray-300">
                                        <li className="flex justify-between py-1 border-b border-gray-100 dark:border-gray-800"><span>• Haferflocken</span><span className="font-bold text-primary">500g (0.89 €)</span></li>
                                        <li className="flex justify-between py-1 border-b border-gray-100 dark:border-gray-800"><span>• Skyr</span><span className="font-bold text-primary">1000g (2.98 €)</span></li>
                                        <li className="flex justify-between py-1 border-b border-gray-100 dark:border-gray-800"><span>• Hähnchenbrust</span><span className="font-bold text-primary">500g (6.99 €)</span></li>
                                    </ul>
                                </div>
                            </div>
                        )}

                        {activeTab === 'profile' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-extrabold text-gray-900 dark:text-white">Dein Profil</h1>
                                <div className="bg-white dark:bg-cardDark p-6 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Ernährungsziel</label>
                                        <select 
                                            value={profile.goal} 
                                            onChange={(e) => setProfile({...profile, goal: e.target.value})}
                                            className="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 text-sm font-medium text-gray-800 dark:text-white"
                                        >
                                            <option>Muskelaufbau & High Protein</option>
                                            <option>Kalorienbewusst abnehmen</option>
                                            <option>Gesunde Ernährung für Schule & Alltag</option>
                                            <option>Günstig & Schnell kochen</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Bevorzugter Supermarkt</label>
                                        <select 
                                            value={profile.supermarket} 
                                            onChange={(e) => setProfile({...profile, supermarket: e.target.value})}
                                            className="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 text-sm font-medium text-gray-800 dark:text-white"
                                        >
                                            <option>Aldi / Lidl</option>
                                            <option>Kaufland / Rewe</option>
                                            <option>Edeka</option>
                                            <option>Penny / Netto</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {selectedRecipe && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end md:items-center justify-center p-0 md:p-4">
                            <div className="bg-white dark:bg-cardDark w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-t-3xl md:rounded-3xl shadow-2xl">
                                <div className="relative h-64">
                                    <img src={selectedRecipe.image} alt={selectedRecipe.name} className="w-full h-full object-cover" />
                                    <button onClick={() => setSelectedRecipe(null)} className="absolute top-4 right-4 w-10 h-10 bg-white/90 dark:bg-cardDark/90 rounded-full flex items-center justify-center font-bold shadow-md">✕</button>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div>
                                        <span className="text-xs font-bold text-primary bg-orange-100 dark:bg-orange-900/30 px-3 py-1 rounded-full">{selectedRecipe.category}</span>
                                        <h2 className="text-2xl font-extrabold text-gray-900 dark:text-white mt-2">{selectedRecipe.name}</h2>
                                        <p className="text-gray-500 text-sm mt-1">{selectedRecipe.description}</p>
                                    </div>
                                    <div className="grid grid-cols-4 gap-2 bg-gray-50 dark:bg-gray-900 p-4 rounded-2xl text-center">
                                        <div><p className="text-xs text-gray-400 font-bold">Kalorien</p><p className="font-extrabold text-gray-900 dark:text-white text-lg">{selectedRecipe.cals} kcal</p></div>
                                        <div><p className="text-xs text-gray-400 font-bold">Eiweiß</p><p className="font-extrabold text-primary text-lg">{selectedRecipe.protein}g</p></div>
                                        <div><p className="text-xs text-gray-400 font-bold">Kohlenh.</p><p className="font-extrabold text-gray-900 dark:text-white text-lg">{selectedRecipe.carbs}g</p></div>
                                        <div><p className="text-xs text-gray-400 font-bold">Fett</p><p className="font-extrabold text-gray-900 dark:text-white text-lg">{selectedRecipe.fat}g</p></div>
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-lg text-gray-900 dark:text-white mb-3">Zutaten</h3>
                                        <ul className="space-y-2">
                                            {selectedRecipe.ingredients.map((ing, idx) => (
                                                <li key={idx} className="flex justify-between p-3 rounded-xl bg-gray-50 dark:bg-gray-900 text-sm font-medium">
                                                    <span className="text-gray-800 dark:text-gray-200">{ing.name}</span>
                                                    <span className="font-bold text-primary">{ing.amount}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-lg text-gray-900 dark:text-white mb-3">Zubereitung</h3>
                                        <ol className="space-y-3">
                                            {selectedRecipe.steps.map((step, idx) => (
                                                <li key={idx} className="flex space-x-3 text-sm">
                                                    <span className="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs shrink-0">{idx + 1}</span>
                                                    <span className="text-gray-700 dark:text-gray-300 font-medium">{step}</span>
                                                </li>
                                            ))}
                                        </ol>
                                    </div>
                                    <button 
                                        onClick={() => {
                                            if (favorites.includes(selectedRecipe.id)) {
                                                setFavorites(favorites.filter(id => id !== selectedRecipe.id));
                                            } else {
                                                setFavorites([...favorites, selectedRecipe.id]);
                                            }
                                        }}
                                        className="w-full py-4 bg-orange-100 dark:bg-orange-900/30 text-primary rounded-2xl font-extrabold text-sm"
                                    >
                                        {favorites.includes(selectedRecipe.id) ? '★ Aus Favoriten entfernt' : '☆ Zu Favoriten hinzufügen'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 bg-white dark:bg-cardDark border-t border-gray-100 dark:border-gray-800 py-3 px-6 flex justify-around items-center z-40 shadow-lg">
                        {[
                            { id: 'home', label: 'Home', icon: 'home' },
                            { id: 'discover', label: 'Entdecken', icon: 'compass' },
                            { id: 'aicoach', label: 'KI-Koch', icon: 'sparkles' },
                            { id: 'cookbook', label: 'Kochbuch', icon: 'book-open' },
                            { id: 'planner', label: 'Planer', icon: 'calendar' }
                        ].map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center space-y-1 transition-all ${activeTab === tab.id ? 'text-primary scale-105' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                <i data-lucide={tab.icon} className="w-6 h-6"></i>
                                <span className="text-[10px] font-bold">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<FoodlyApp />, document.getElementById('root'));
    </script>
</body>
</html>
